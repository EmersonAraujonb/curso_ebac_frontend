<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário bootstrap</title>
</head>
<body>
    <form class="d-md-flex"> 
        <div class="container-sm p-3 g-3">
            <h1>Formulário de contato</h1>
            <div class="form-floating mb-3 row g-3 align-items-center   ">
                <input type="name" class="form-control" id="floatingInput" placeholder="Nome completo" required>
                <label for="floatingInput">Nome completo:</label>
                </div>
            <div class="form-floating mb-3 mb-3 row g-3 align-items-center   ">
                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
                <label for="floatingInput">E-mail:</label>
            </div>
            <div class="form-floating mb-3 mb-3 row g-3 align-items-center   ">
                <input type="tel" class="form-control" id="floatingInput" placeholder="(00) 00000-0000" required>
                <label for="floatingInput">Telefone:</label>
            </div>
            <div class="form-floating mb-3 row g-3 align-items-center   ">
                <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 200px; resize: none;" required></textarea>
                <label for="floatingTextarea2">Sua mensagem!</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="termsCheckbox" required>
                <label class="form-check-label" for="termsCheckbox">Aceito os termos de uso do site.</label>
            </div>
            <button class="btn btn-success btn-lg">Enviar</button>             
        </div>
    </form>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
