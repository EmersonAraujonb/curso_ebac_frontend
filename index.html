<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Números</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>  
    <div class="container">
        <h1>Verificar se um número é maior que outro</h1>
        <form id="number-form">
            <label for="number1">Número A:</label>
            <input type="number" id="numberA" name="number1" required><br><br>
            
            <label for="number2">Número B:</label>
            <input type="number" id="numberB" name="number2" required><br><br>
            
            <input type="submit" id="btn-verificar" value="Verificar" >
        </form>
        <p class="success-message"></p>
        <p class="error-message"></p>
    </div>

<script src="./scripts.js"></script>
</body>
</html>
