<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single+Ink:wght@100..900&family=Bungee&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS">
    <title>Cronomêtro</title>
</head>
<body>
    <div class="timer" id="display">00:00:00</div>
    <div class="container">
        <section class="align-inputs">
            <div class="input-container">
                <label for="hour">Horas</label>
                <input type="number" class="input-temp" name="" id="hour" value="00" max="99" min="0">
            </div>
            <div class="input-container">
                <label for="minute">Minutos</label>
                <input type="number" class="input-temp" name="" id="minute" value="00" max="59" min="0">
            </div>
            <div class="input-container">
                <label for="second">Segundos</label>
                <input type="number" class="input-temp" name="" id="second" value="00" max="59" min="0">
            </div>
        </section>
    </div>
    <div class="button">
        <button id="toggle" class="btn btn-primary"><img src="https://img.icons8.com/?size=100&id=10735&format=png&color=000000" alt="iniciar"></button>
        <button id="resetar" disabled> <img src="https://img.icons8.com/?size=100&id=12494&format=png&color=000000" alt="resetar"> RESETAR </button>
    </div>
    <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Aviso</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="fechar"></button>
            </div>
            <div class="modal-body">
                Digite um tempo válido (maior que zero).
            </div>
            <div class="modal-footer">
                <button type="button" id="fecharModal" class="btn btn-secondary" data-bs-dismiss="modal">
                    Fechar
                </button>
            </div>
            </div>
        </div>
    </div>
    <script src="@@ENDERECO_DO_SCRIPT"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
